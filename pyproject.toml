[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rutas-quindio"
version = "0.1.0"
description = "Rutas del Paisaje Cultural Cafetero - Proyecto final de Análisis de Algoritmos (UniQuindío)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyproj>=3.6",
]

[project.optional-dependencies]
# Descarga y preparación de la red (R1).
red = ["osmnx>=2.0", "networkx>=3.3"]
# Verificación contra librerías (solo pruebas) y gráficas.
dev = ["pytest>=8", "networkx>=3.3", "scipy>=1.11", "matplotlib>=3.8", "pandas>=2.1"]
# Aplicación (R5).
app = ["streamlit>=1.38", "folium>=0.17", "streamlit-folium>=0.22", "pandas>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: pruebas que tardan varios segundos"]
